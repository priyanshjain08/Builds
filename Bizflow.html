<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BizFlow — Business Manager</title>
<style>
:root{--bg:#090d13;--panel:#10161f;--panel2:#151d28;--line:#263241;--text:#f4f7fb;--muted:#8996a7;--accent:#7c8cff;--accent2:#9b8cff;--green:#35d39a;--yellow:#f2b84b;--red:#ff6f82}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:245px;flex:none;background:#0c1118;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:5px 8px 28px}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800}.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:11px}.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:9px;text-align:left;margin:2px 0}.nav:hover{background:#ffffff08;color:#fff}.nav.active{background:#7c8cff18;color:#bfc6ff}.business{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px 4px}.business small{display:block;color:var(--muted);margin-top:4px}
.main{min-width:0;flex:1}.topbar{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#0b1017e8;backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.topbar h1{font-size:24px;margin:3px 0 0}.actions{display:flex;gap:9px;align-items:center}.content{padding:30px;max-width:1450px;margin:auto}
.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:10px 14px;border-radius:9px}.btn:hover{border-color:#435166}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.btn.ghost{background:transparent}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.label{color:var(--muted);font-size:12px}.value{font-size:26px;font-weight:750;margin-top:7px}.sub{color:var(--muted);font-size:12px;margin-top:7px}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}
.two{grid-template-columns:1.5fr 1fr;margin-top:16px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.head h2{font-size:15px;margin:0}.muted{color:var(--muted)}
.chart{height:225px;display:flex;align-items:end;gap:10px;padding:10px 4px 0}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end}.bar{min-height:8px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#a9b0ff,#6f7fff)}.barlabel{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}
.table{width:100%;border-collapse:collapse}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;text-align:left;border-bottom:1px solid var(--line);padding:10px}.table td{border-bottom:1px solid #202a36;padding:13px 10px}.table tr:last-child td{border-bottom:0}.badge{font-size:11px;border-radius:99px;padding:5px 8px;background:#ffffff0a;color:#b4beca}.badge.green{background:#35d39a15;color:var(--green)}.badge.yellow{background:#f2b84b15;color:var(--yellow)}
.toolbar{display:flex;gap:10px;margin-bottom:16px}.search{flex:1}.input{width:100%;border:1px solid var(--line);background:#0b1016;color:#fff;border-radius:9px;padding:10px 12px;outline:none}.input:focus{border-color:var(--accent)}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.product-title{font-weight:700}.progress{height:7px;border-radius:99px;background:#222c39;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}.empty{text-align:center;padding:40px;color:var(--muted)}
#backdrop{display:none;position:fixed;inset:0;background:#000b;z-index:20;place-items:center;padding:20px}#backdrop.show{display:grid}.modal{width:min(560px,100%);background:#111821;border:1px solid #344052;border-radius:15px;padding:22px;box-shadow:0 25px 80px #0008}.modal h2{margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
#toast{position:fixed;right:20px;bottom:20px;background:#17202b;border:1px solid #354252;border-radius:10px;padding:12px 15px;transform:translateY(100px);transition:.2s;z-index:30}#toast.show{transform:none}#menu{display:none}
@media(max-width:900px){.sidebar{width:210px}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.products{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.topbar{padding:0 16px}#menu{display:inline-block;background:none;border:0;color:#fff;font-size:20px;margin-right:10px}.top-left{display:flex;align-items:center}.content{padding:18px}.stats,.products{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.topbar .primary{padding:9px}.table{min-width:650px}.card.table-card{overflow:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand"><div class="logo">BF</div><div><b>BizFlow</b><small>Business Manager</small></div></div>
<nav>
<button class="nav active" data-page="dashboard">▦ <span>Dashboard</span></button>
<button class="nav" data-page="customers">♙ <span>Customers</span></button>
<button class="nav" data-page="products">▣ <span>Products</span></button>
<button class="nav" data-page="orders">◫ <span>Orders</span></button>
<button class="nav" data-page="inventory">◈ <span>Inventory</span></button>
<button class="nav" data-page="analytics">◒ <span>Analytics</span></button>
<button class="nav" data-page="settings">⚙ <span>Settings</span></button>
</nav>
<div class="business"><b id="businessName">My Business</b><small>Owner</small></div>
</aside>
<main class="main">
<header class="topbar"><div class="top-left"><button id="menu">☰</button><div><div class="crumb" id="eyebrow">Overview</div><h1 id="title">Dashboard</h1></div></div><div class="actions"><button class="btn primary" id="newOrder">+ New Order</button></div></header>
<section class="content" id="content"></section>
</main></div>
<div id="backdrop"><div class="modal" id="modal"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const initial={customers:[{id:"c1",name:"Aarav Mehta",phone:"+91 98765 43210",email:"aarav@example.com",spent:12800,orders:6},{id:"c2",name:"Riya Sharma",phone:"+91 99887 66554",email:"riya@example.com",spent:7400,orders:3},{id:"c3",name:"Kabir Singh",phone:"+91 91234 56789",email:"kabir@example.com",spent:22100,orders:9}],products:[{id:"p1",name:"Wireless Keyboard",sku:"KB-001",category:"Accessories",price:1499,cost:900,stock:24,threshold:8},{id:"p2",name:"USB-C Hub",sku:"HB-002",category:"Accessories",price:2199,cost:1400,stock:7,threshold:10},{id:"p3",name:"27-inch Monitor",sku:"MN-003",category:"Displays",price:18999,cost:14000,stock:12,threshold:4},{id:"p4",name:"Laptop Stand",sku:"LS-004",category:"Office",price:2499,cost:1600,stock:18,threshold:6}],orders:[{id:"o1",number:"ORD-1004",customer:"Kabir Singh",total:18999,status:"Completed",payment:"Paid",date:"2026-08-22"},{id:"o2",number:"ORD-1003",customer:"Aarav Mehta",total:2998,status:"Completed",payment:"Paid",date:"2026-08-21"},{id:"o3",number:"ORD-1002",customer:"Riya Sharma",total:2199,status:"Processing",payment:"Paid",date:"2026-08-20"},{id:"o4",number:"ORD-1001",customer:"Aarav Mehta",total:2499,status:"Pending",payment:"Unpaid",date:"2026-08-19"}],settings:{business:"My Business",currency:"INR"}};
let state=JSON.parse(localStorage.getItem("bizflow2")||"null")||initial;
const save=()=>localStorage.setItem("bizflow2",JSON.stringify(state)),money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:state.settings.currency||"INR",maximumFractionDigits:0}).format(n||0),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function toast(x){let t=$("#toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function stat(a,b,c,cl=""){return `<div class="card"><div class="label">${a}</div><div class="value">${b}</div><div class="sub ${cl}">${c}</div></div>`}
function setPage(p){document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===p));let m={dashboard:["Overview","Dashboard"],customers:["Relationships","Customers"],products:["Catalog","Products"],orders:["Sales","Orders"],inventory:["Operations","Inventory"],analytics:["Insights","Analytics"],settings:["Configuration","Settings"]}[p];$("#eyebrow").textContent=m[0];$("#title").textContent=m[1];({dashboard,customers,products,orders,inventory,analytics,settings}[p])();$("#sidebar").classList.remove("open")}
function dashboard(){let rev=state.orders.filter(o=>o.status!=="Cancelled").reduce((a,o)=>a+o.total,0),low=state.products.filter(p=>p.stock<=p.threshold);$("#content").innerHTML=`<div class="grid stats">${stat("Revenue",money(rev),"Current order value","green")}${stat("Orders",state.orders.length,"All statuses")}${stat("Customers",state.customers.length,"Customer records")}${stat("Low stock",low.length,low.length?"Needs attention":"All healthy",low.length?"yellow":"green")}</div><div class="grid two"><div class="card"><div class="head"><h2>Sales overview</h2><span class="muted">Last 7 days</span></div><div class="chart">${[42,68,51,82,73,99,60].map((v,i)=>`<div class="barwrap"><div class="bar" style="height:${v}%"></div><div class="barlabel">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i]}</div></div>`).join("")}</div></div><div class="card"><div class="head"><h2>Low stock</h2><span class="muted">${low.length} items</span></div>${low.map(p=>`<p><b>${esc(p.name)}</b> <span class="yellow">· ${p.stock} left</span></p>`).join("")||'<div class="empty">No low-stock products.</div>'}</div></div><div class="card table-card" style="margin-top:16px"><div class="head"><h2>Recent orders</h2><button class="btn" onclick="setPage('orders')">View all</button></div>${orderTable(state.orders)}</div>`}
function orderTable(a){return `<table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Payment</th><th>Date</th></tr></thead><tbody>${a.map(o=>`<tr><td><b>${o.number}</b></td><td>${esc(o.customer)}</td><td>${money(o.total)}</td><td><span class="badge ${o.status==="Completed"?"green":"yellow"}">${o.status}</span></td><td>${o.payment}</td><td>${o.date}</td></tr>`).join("")}</tbody></table>`}
function customers(){listView("customer")} function products(){listView("product")}
function listView(type){let c=type==="customer";$("#content").innerHTML=`<div class="toolbar"><div class="search"><input class="input" id="search" placeholder="Search ${c?"customers":"products"}..."></div><button class="btn primary" onclick="${c?"customerModal()":"productModal()"}">+ Add ${c?"Customer":"Product"}</button></div><div class="card table-card" id="list"></div>`;$("#search").oninput=e=>draw(type,e.target.value);draw(type,"")}
function draw(type,q){let c=type==="customer",a=(c?state.customers:state.products).filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));$("#list").innerHTML=c?`<table class="table"><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Spent</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.email)}</div></td><td>${esc(x.phone)}</td><td>${x.orders}</td><td>${money(x.spent)}</td><td><button class="btn" onclick="customerModal('${x.id}')">Edit</button></td></tr>`).join("")}</tbody></table>`:`<div class="products">${a.map(x=>`<div class="card"><div class="head"><div><div class="product-title">${esc(x.name)}</div><div class="muted">${esc(x.sku)} · ${esc(x.category)}</div></div><button class="btn" onclick="productModal('${x.id}')">Edit</button></div><p>Price <b>${money(x.price)}</b></p><p>Stock <b class="${x.stock<=x.threshold?"yellow":"green"}">${x.stock}</b></p><div class="progress"><i style="width:${Math.min(100,x.stock/(x.threshold*2||1)*100)}%"></i></div></div>`).join("")}</div>`}
function orders(){$("#content").innerHTML=`<div class="toolbar"><div class="search"><input class="input" id="search" placeholder="Search orders..."></div><button class="btn primary" onclick="orderModal()">+ New Order</button></div><div class="card table-card" id="list"></div>`;$("#search").oninput=e=>$("#list").innerHTML=orderTable(state.orders.filter(o=>JSON.stringify(o).toLowerCase().includes(e.target.value.toLowerCase())));$("#list").innerHTML=orderTable(state.orders)}
function inventory(){$("#content").innerHTML=`<div class="card"><div class="head"><h2>Inventory levels</h2><span class="muted">${state.products.length} products</span></div>${state.products.map(p=>`<div style="padding:14px 0;border-bottom:1px solid #202a36"><div class="head"><b>${esc(p.name)}</b><b class="${p.stock<=p.threshold?"yellow":"green"}">${p.stock} units</b></div><div class="progress"><i style="width:${Math.min(100,p.stock/(p.threshold*2||1)*100)}%"></i></div></div>`).join("")}</div>`}
function analytics(){let d=state.orders.filter(o=>o.status==="Completed"),r=d.reduce((a,o)=>a+o.total,0),iv=state.products.reduce((a,p)=>a+p.cost*p.stock,0);$("#content").innerHTML=`<div class="grid stats">${stat("Revenue",money(r),"Completed orders","green")}${stat("Completed",d.length,"Fulfilled orders")}${stat("Average order",money(d.length?r/d.length:0),"Per completed order")}${stat("Inventory value",money(iv),"At cost")}</div><div class="card" style="margin-top:16px"><div class="head"><h2>Business snapshot</h2></div><p>Customers: <b>${state.customers.length}</b></p><p>Products: <b>${state.products.length}</b></p><p>Low stock: <b class="yellow">${state.products.filter(p=>p.stock<=p.threshold).length}</b></p></div>`}
function settings(){$("#content").innerHTML=`<div class="card" style="max-width:700px"><div class="head"><h2>Business settings</h2></div><div class="form"><div class="field full"><label>Business name</label><input class="input" id="biz" value="${esc(state.settings.business)}"></div><div class="field"><label>Currency</label><select class="input" id="currency"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option></select></div></div><div class="modal-actions"><button class="btn primary" onclick="saveSettings()">Save settings</button></div></div>`}
function open(h){$("#modal").innerHTML=h;$("#backdrop").classList.add("show")}function close(){$("#backdrop").classList.remove("show")}
function customerModal(id){let c=state.customers.find(x=>x.id===id)||{name:"",phone:"",email:""};open(`<h2>${id?"Edit":"Add"} customer</h2><div class="form"><div class="field"><label>Name</label><input class="input" id="n" value="${esc(c.name)}"></div><div class="field"><label>Phone</label><input class="input" id="p" value="${esc(c.phone)}"></div><div class="field full"><label>Email</label><input class="input" id="e" value="${esc(c.email)}"></div></div><div class="modal-actions"><button class="btn" onclick="close()">Cancel</button><button class="btn primary" onclick="saveCustomer('${id||""}')">Save</button></div>`)}
function saveCustomer(id){let d={name:$("#n").value.trim(),phone:$("#p").value.trim(),email:$("#e").value.trim()};if(!d.name)return toast("Name is required");if(id)Object.assign(state.customers.find(x=>x.id===id),d);else state.customers.push({id:uid(),...d,spent:0,orders:0});save();close();customers();toast("Customer saved")}
function productModal(id){let p=state.products.find(x=>x.id===id)||{name:"",sku:"",category:"",price:0,cost:0,stock:0,threshold:5};open(`<h2>${id?"Edit":"Add"} product</h2><div class="form"><div class="field"><label>Name</label><input class="input" id="pn" value="${esc(p.name)}"></div><div class="field"><label>SKU</label><input class="input" id="ps" value="${esc(p.sku)}"></div><div class="field"><label>Category</label><input class="input" id="pc" value="${esc(p.category)}"></div><div class="field"><label>Price</label><input class="input" id="pp" type="number" value="${p.price}"></div><div class="field"><label>Cost</label><input class="input" id="po" type="number" value="${p.cost}"></div><div class="field"><label>Stock</label><input class="input" id="pq" type="number" value="${p.stock}"></div><div class="field"><label>Low-stock threshold</label><input class="input" id="pt" type="number" value="${p.threshold}"></div></div><div class="modal-actions"><button class="btn" onclick="close()">Cancel</button><button class="btn primary" onclick="saveProduct('${id||""}')">Save</button></div>`)}
function saveProduct(id){let d={name:$("#pn").value.trim(),sku:$("#ps").value.trim(),category:$("#pc").value.trim(),price:+$("#pp").value,cost:+$("#po").value,stock:+$("#pq").value,threshold:+$("#pt").value};if(!d.name||!d.sku)return toast("Name and SKU are required");if(id)Object.assign(state.products.find(x=>x.id===id),d);else state.products.push({id:uid(),...d});save();close();products();toast("Product saved")}
function orderModal(){let cs=state.customers.map(c=>`<option>${esc(c.name)}</option>`).join(""),ps=state.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (${p.stock})</option>`).join("");open(`<h2>New order</h2><div class="form"><div class="field full"><label>Customer</label><select class="input" id="oc">${cs}</select></div><div class="field full"><label>Product</label><select class="input" id="op">${ps}</select></div><div class="field"><label>Quantity</label><input class="input" id="oq" type="number" min="1" value="1"></div><div class="field"><label>Status</label><select class="input" id="os"><option>Pending</option><option>Processing</option><option>Completed</option></select></div><div class="field"><label>Payment</label><select class="input" id="pay"><option>Unpaid</option><option>Paid</option><option>Partially paid</option></select></div></div><div class="modal-actions"><button class="btn" onclick="close()">Cancel</button><button class="btn primary" onclick="saveOrder()">Create order</button></div>`)}
function saveOrder(){let p=state.products.find(x=>x.id===$("#op").value),q=+$("#oq").value,s=$("#os").value;if(!p||q<1||q>p.stock)return toast("Invalid quantity or stock");let o={id:uid(),number:"ORD-"+(1001+state.orders.length),customer:$("#oc").value,total:p.price*q,status:s,payment:$("#pay").value,date:new Date().toISOString().slice(0,10)};state.orders.push(o);if(s==="Completed"){p.stock-=q;let c=state.customers.find(x=>x.name===o.customer);if(c){c.orders++;c.spent+=o.total}}save();close();orders();toast("Order created")}
function saveSettings(){state.settings.business=$("#biz").value.trim()||"My Business";state.settings.currency=$("#currency").value;$("#businessName").textContent=state.settings.business;save();toast("Settings saved");setPage("dashboard")}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>setPage(b.dataset.page));$("#newOrder").onclick=orderModal;$("#menu").onclick=()=>$("#sidebar").classList.toggle("open");$("#backdrop").onclick=e=>{if(e.target.id==="backdrop")close()};$("#businessName").textContent=state.settings.business;setPage("dashboard");
</script>
</body>
</html>
