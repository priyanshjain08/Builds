<title>Real Estate Outreach CRM</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --border: #e5e7eb; --accent: #16a34a; --accent2: #2563eb; --danger: #dc2626;
    --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2126; --text:#e8e9eb; --muted:#9aa1ab; --border:#2c3038; }
  }
  :root[data-theme="dark"] { --bg:#14161a; --card:#1e2126; --text:#e8e9eb; --muted:#9aa1ab; --border:#2c3038; }
  :root[data-theme="light"] { --bg:#f7f8fa; --card:#ffffff; --text:#1a1d21; --muted:#6b7280; --border:#e5e7eb; }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin:0; padding: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }

  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .toolbar input, .toolbar select { padding:7px 10px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); font-size:.85rem; }
  .toolbar input[type="text"] { flex:1; min-width:180px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 14px; font-size:.8rem; color:var(--muted); }
  .stat b { color: var(--text); font-size: 1rem; display:block; }

  .grid { display:grid; gap:10px; }
  .lead { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .lead-top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .name { font-weight:600; font-size:.95rem; }
  .meta { color:var(--muted); font-size:.78rem; margin-top:2px; }
  .badge { display:inline-block; font-size:.7rem; padding:2px 8px; border-radius:99px; border:1px solid var(--border); margin-right:6px; }
  .badge.has { color: var(--accent2); border-color: var(--accent2); }
  .badge.no { color: var(--warn); border-color: var(--warn); }

  .msg { margin-top:8px; font-size:.82rem; line-height:1.4; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; max-height:5.6em; overflow:auto; }
  .row-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  a.wa-btn { background: var(--accent); color:white; text-decoration:none; padding:7px 14px; border-radius:8px; font-size:.82rem; font-weight:600; }
  a.wa-btn:hover { opacity:.9; }
  a.wa-btn.sent { background: #9ca3af; color:#f3f4f6; }
  a.wa-btn.sent:hover { opacity:1; }
  select.status-select { padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:.8rem; }
  textarea.notes { flex:1; min-width:200px; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:.8rem; resize:vertical; min-height:32px; }

  .status-New { border-left: 4px solid var(--muted); }
  .status-Contacted { border-left: 4px solid var(--accent2); }
  .status-Replied { border-left: 4px solid var(--warn); }
  .status-Interested { border-left: 4px solid #9333ea; }
  .status-Converted { border-left: 4px solid var(--accent); }
  .status-NotInterested { border-left: 4px solid var(--danger); opacity:.6; }

  .export-btn { background:var(--accent2); color:white; border:none; padding:7px 14px; border-radius:8px; font-size:.82rem; cursor:pointer; font-weight:600; }
</style>

<h1>Real Estate Outreach CRM</h1>
<div class="sub">162 leads &middot; India domestic &middot; click WhatsApp to open a pre-filled chat, update status as you go (saved automatically in this browser)</div>

    <option value="name_asc">Sort: Name A-Z</option>

</div>

const STORE_KEY = "re_crm_status_v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e) { return {}; }
}
function saveState(state) {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
let state = loadState();

function getLeadState(id) {
  return state[id] || { status: "New", notes: "", sent: false };
}
function setLeadState(id, patch) {
  state[id] = Object.assign(getLeadState(id), patch);
  saveState(state);
  renderStats();
}

function markSent(id) {
  const current = getLeadState(id);
  const patch = { sent: true };
  if (current.status === "New") patch.status = "Contacted";
  setLeadState(id, patch);
  render();
}

function leadId(lead) {
  return lead.phone_clean + "|" + lead.name;
}

function renderStats() {
  const counts = { New:0, Contacted:0, Replied:0, Interested:0, Converted:0, NotInterested:0 };
  LEADS.forEach(l => {
    const s = getLeadState(leadId(l)).status || "New";
    counts[s] = (counts[s]||0) + 1;
  });
  const el = document.getElementById("stats");
  el.innerHTML = Object.entries(counts).map(([k,v]) =>
    `<div class="stat"><b>${v}</b>${k.replace("NotInterested","Not Interested")}</div>`
  ).join("");
}

function render() {
  const search = document.getElementById("search").value.toLowerCase();
  const segFilter = document.getElementById("filterSegment").value;
  const statusFilter = document.getElementById("filterStatus").value;
  const sortBy = document.getElementById("sortBy").value;

  let items = LEADS.filter(l => {
    if (segFilter && l.segment !== segFilter) return false;
    const st = getLeadState(leadId(l)).status || "New";
    if (statusFilter && st !== statusFilter) return false;
    if (search && !(l.name.toLowerCase().includes(search) || (l.city||"").toLowerCase().includes(search))) return false;
    return true;
  });

  items.sort((a,b) => {
    if (sortBy === "name_asc") return a.name.localeCompare(b.name);
    return (parseInt(b.reviews_count)||0) - (parseInt(a.reviews_count)||0);
  });

  const grid = document.getElementById("leadsGrid");
  grid.innerHTML = items.map(l => {
    const id = leadId(l);
    const st = getLeadState(id);
    const badge = l.segment === "HAS_website"
      ? `<span class="badge has">Has website</span>`
      : `<span class="badge no">No website</span>`;
    return `
      <div class="lead status-${(st.status||'New').replace(/\\s/g,'')}" data-id="${id}">
        <div class="lead-top">
          <div>
            <div class="name">${escapeHtml(l.name)}</div>
            <div class="meta">${badge}${escapeHtml(l.city||'')} &middot; ${l.rating||'-'}★ (${l.reviews_count||0} reviews) &middot; ${escapeHtml(l.phone||'')}</div>
          </div>
        </div>
        <div class="msg">${escapeHtml(l.message)}</div>
        <div class="row-actions">
          <a class="wa-btn${st.sent ? ' sent' : ''}" href="${l.wa_link}" target="_blank" rel="noopener" onclick="markSent('${id}')">${st.sent ? 'Sent ✓' : 'Send on WhatsApp'}</a>
          <select class="status-select" onchange="setLeadState('${id}', {status: this.value}); render();">
            ${["New","Contacted","Replied","Interested","Converted","NotInterested"].map(s =>
              `<option value="${s}" ${st.status===s?'selected':''}>${s.replace("NotInterested","Not Interested")}</option>`
            ).join("")}
          </select>
          <textarea class="notes" placeholder="Notes..." onblur="setLeadState('${id}', {notes: this.value})">${escapeHtml(st.notes||'')}</textarea>
        </div>
      </div>
    `;
  }).join("") || `<div class="sub">No leads match this filter.</div>`;
}

function escapeHtml(s) {
  return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filterSegment").addEventListener("change", render);
document.getElementById("filterStatus").addEventListener("change", render);
document.getElementById("sortBy").addEventListener("change", render);

document.getElementById("exportBtn").addEventListener("click", () => {
  const rows = [["name","segment","city","phone","status","notes"]];
  LEADS.forEach(l => {
    const st = getLeadState(leadId(l));
    rows.push([l.name, l.segment, l.city, l.phone, st.status||"New", (st.notes||"").replace(/\\n/g," ")]);
  });
  const csv = rows.map(r => r.map(v => `"${(v||"").toString().replace(/"/g,'""')}"`).join(",")).join("\\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "outreach_progress.csv"; a.click();
  URL.revokeObjectURL(url);
});

renderStats();
render();
</script>
