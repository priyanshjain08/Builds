<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>ProjectFlow AI · Smart project & client workspace</title>
  <!-- Fonts & Icons & Charts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --sidebar-bg: #0f1a2e;
      --sidebar-width: 250px;
      --primary: #3b5bfd;
      --primary-soft: #eef1ff;
      --text: #1a2233;
      --text-soft: #5f6b7f;
      --border: #e5e9f0;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.02);
      --shadow-md: 0 12px 30px rgba(0,0,0,0.06);
      --radius: 18px;
      --radius-sm: 12px;
      --danger: #e04f5f;
      --success: #2bb673;
      --warning: #f5a623;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --transition: 0.2s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      line-height: 1.4;
    }
    button, input, select, textarea { font-family: inherit; }
    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      color: #e9edf5;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
      z-index: 50;
      transition: transform 0.3s ease;
      box-shadow: 2px 0 20px rgba(0,0,0,0.08);
    }
    .sidebar-header {
      padding: 28px 20px 20px;
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-header i { color: #8ea9ff; }
    .nav {
      flex: 1;
      padding: 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      color: #cbd5e6;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .nav-item i { width: 20px; font-size: 1.1rem; }
    .nav-item.active { background: rgba(255,255,255,0.08); color: white; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,0.05); color: white; }
    .sidebar-footer {
      padding: 18px 20px;
      font-size: 0.8rem;
      color: #8896b0;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 24px 30px 40px;
      width: calc(100% - var(--sidebar-width));
      transition: margin 0.3s;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .page-title {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -1px;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 10px 18px;
      gap: 8px;
      min-width: 260px;
      box-shadow: var(--shadow-sm);
    }
    .search-bar input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 0.9rem;
    }
    .btn {
      border: none;
      background: white;
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary { background: var(--primary); color: white; border: none; }
    .btn-primary:hover { background: #2a47d8; }
    .btn-outline:hover { background: #f0f2f8; }
    .btn-danger { background: #fff0f2; color: var(--danger); border-color: #ffd2d8; }
    .grid { display: grid; gap: 20px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: 0.2s;
    }
    .stat-card:hover { box-shadow: var(--shadow-md); }
    .stat-label { font-size: 0.85rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-number { font-size: 2.3rem; font-weight: 700; margin-top: 6px; }
    .stat-icon { float: right; font-size: 1.8rem; color: var(--primary); opacity: 0.7; }
    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .panel-title { font-weight: 700; font-size: 1.2rem; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 12px 8px; color: var(--text-soft); font-weight: 600; font-size: 0.8rem; border-bottom: 1px solid var(--border); }
    td { padding: 14px 8px; border-bottom: 1px solid #f0f2f7; font-size: 0.9rem; }
    .badge {
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #f1f4fa;
      color: #3d4b66;
      display: inline-block;
    }
    .badge.planning { background: #e7ecff; color: #3b5bfd; }
    .badge.in-progress { background: #fff4e5; color: #c47f17; }
    .badge.completed { background: #e2f7ec; color: #16794c; }
    .badge.review, .badge.on-hold { background: #f1eafc; color: #7a58c4; }
    .progress-bar { background: #ebeff8; height: 8px; border-radius: 20px; overflow: hidden; width: 100%; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 20px; }
    .flex { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; z-index: 100;
      visibility: hidden; opacity: 0; transition: 0.2s;
    }
    .modal-backdrop.active { visibility: visible; opacity: 1; }
    .modal {
      background: white; border-radius: 24px; width: 600px; max-width: 92vw;
      max-height: 90vh; overflow-y: auto; padding: 28px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
    }
    .modal h3 { margin-bottom: 20px; font-size: 1.5rem; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px;
      font-size: 0.9rem; background: #fafbfe;
    }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .chip { background: #eef1fa; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; }
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; width: 100%; padding: 20px; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .hamburger { display: none; background: none; border: none; font-size: 1.8rem; cursor: pointer; }
    @media (max-width: 900px) { .hamburger { display: block; } }
  </style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header"><i class="fas fa-bolt"></i> ProjectFlow AI</div>
  <div class="nav">
    <div class="nav-item active" data-page="dashboard"><i class="fas fa-th-large"></i> Dashboard</div>
    <div class="nav-item" data-page="projects"><i class="fas fa-briefcase"></i> Projects</div>
    <div class="nav-item" data-page="tasks"><i class="fas fa-check-circle"></i> Tasks</div>
    <div class="nav-item" data-page="clients"><i class="fas fa-users"></i> Clients</div>
    <div class="nav-item" data-page="calendar"><i class="fas fa-calendar-alt"></i> Calendar</div>
    <div class="nav-item" data-page="ai-planner"><i class="fas fa-robot"></i> AI Planner</div>
    <div class="nav-item" data-page="analytics"><i class="fas fa-chart-line"></i> Analytics</div>
    <div class="nav-item" data-page="settings"><i class="fas fa-cog"></i> Settings</div>
  </div>
  <div class="sidebar-footer">v1.0 · localStorage</div>
</div>

<div class="main">
  <div class="topbar">
    <button class="hamburger" id="menuToggle"><i class="fas fa-bars"></i></button>
    <div class="page-title" id="pageTitle">Dashboard</div>
    <div class="search-bar"><i class="fas fa-search"></i><input id="globalSearchInput" placeholder="Search anything..."></div>
  </div>
  <div id="appContent"></div>
</div>

<!-- Modal container -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<script>
  (function(){
    // ----------------- DATA STORE -----------------
    const STORAGE_KEY = 'projectflow_ai_data';
    let store = loadData();

    function defaultData(){
      return {
        settings: { workspaceName: 'Acme Studio', displayName: 'Alex Morgan', showCompletedTasks: true },
        clients: [
          { id: 'c1', name: 'Sarah Lin', email: 'sarah@northpeak.com', phone: '555-0142', company: 'Northpeak', notes: 'Prefers email communication.' },
          { id: 'c2', name: 'Diego Ramos', email: 'diego@brightlabs.io', phone: '555-0189', company: 'Bright Labs', notes: 'Key decision maker.' },
          { id: 'c3', name: 'Mia Chen', email: 'mia@vertex.co', phone: '555-0134', company: 'Vertex', notes: 'Interested in long-term retainer.' }
        ],
        projects: [
          { id: 'p1', name: 'E-commerce Website', clientId: 'c1', description: 'Modern storefront for clothing brand', status: 'In Progress', deadline: '2026-10-25', progress: 60 },
          { id: 'p2', name: 'Mobile App Redesign', clientId: 'c2', description: 'UX overhaul for fintech app', status: 'Planning', deadline: '2026-11-10', progress: 15 },
          { id: 'p3', name: 'Brand Identity', clientId: 'c3', description: 'Logo, colors, style guide', status: 'Review', deadline: '2026-09-30', progress: 90 },
          { id: 'p4', name: 'SEO Campaign', clientId: 'c1', description: 'Organic growth strategy', status: 'On Hold', deadline: '2026-12-05', progress: 30 },
        ],
        tasks: [
          { id: 't1', projectId: 'p1', title: 'Product catalog setup', dueDate: '2026-10-05', priority: 'High', status: 'In Progress' },
          { id: 't2', projectId: 'p1', title: 'Payment gateway integration', dueDate: '2026-10-12', priority: 'Urgent', status: 'To Do' },
          { id: 't3', projectId: 'p1', title: 'Responsive polish', dueDate: '2026-10-15', priority: 'Medium', status: 'Completed' },
          { id: 't4', projectId: 'p2', title: 'Wireframes approval', dueDate: '2026-10-08', priority: 'High', status: 'In Progress' },
          { id: 't5', projectId: 'p3', title: 'Logo variations', dueDate: '2026-09-25', priority: 'Medium', status: 'Completed' },
          { id: 't6', projectId: 'p4', title: 'Keyword research', dueDate: '2026-10-18', priority: 'Low', status: 'To Do' },
        ]
      };
    }

    function loadData(){
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) return JSON.parse(raw);
        const def = defaultData();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(def));
        return def;
      } catch(e) { return defaultData(); }
    }

    function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }

    // ---------- helpers ----------
    function getProjectById(id){ return store.projects.find(p => p.id === id); }
    function getClientById(id){ return store.clients.find(c => c.id === id); }
    function getTasksForProject(projectId){ return store.tasks.filter(t => t.projectId === projectId); }
    function getClientProjects(clientId){ return store.projects.filter(p => p.clientId === clientId); }

    function updateProjectProgress(projectId){
      const tasks = getTasksForProject(projectId);
      if(tasks.length === 0) { const p = getProjectById(projectId); if(p) p.progress = 0; return; }
      const completed = tasks.filter(t => t.status === 'Completed').length;
      const progress = Math.round((completed / tasks.length) * 100);
      const p = getProjectById(projectId);
      if(p) p.progress = progress;
    }

    function refreshAllProgress(){
      store.projects.forEach(p => updateProjectProgress(p.id));
    }

    // navigation & render
    const pageTitleMap = {
      dashboard: 'Dashboard', projects: 'Projects', tasks: 'Tasks', clients: 'Clients',
      calendar: 'Calendar', 'ai-planner': 'AI Project Planner', analytics: 'Analytics', settings: 'Settings'
    };

    function switchPage(page){
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');
      document.getElementById('pageTitle').innerText = pageTitleMap[page] || 'Dashboard';
      renderPage(page);
      document.getElementById('sidebar').classList.remove('open');
    }

    // global search
    document.getElementById('globalSearchInput').addEventListener('input', function(e){
      const query = e.target.value.toLowerCase().trim();
      if(query.length > 1){
        const results = [];
        store.projects.forEach(p => { if(p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query)) results.push('Project: '+p.name); });
        store.clients.forEach(c => { if(c.name.toLowerCase().includes(query) || c.company.toLowerCase().includes(query)) results.push('Client: '+c.name); });
        store.tasks.forEach(t => { if(t.title.toLowerCase().includes(query)) results.push('Task: '+t.title); });
        if(results.length){ alert('🔎 Search results:\n' + results.join('\n')); } 
      }
    });

    // ------- RENDER PAGES ------
    function renderPage(page){
      const app = document.getElementById('appContent');
      switch(page){
        case 'dashboard': renderDashboard(app); break;
        case 'projects': renderProjects(app); break;
        case 'tasks': renderTasks(app); break;
        case 'clients': renderClients(app); break;
        case 'calendar': renderCalendar(app); break;
        case 'ai-planner': renderAIPlanner(app); break;
        case 'analytics': renderAnalytics(app); break;
        case 'settings': renderSettings(app); break;
        default: renderDashboard(app);
      }
      refreshAllProgress(); saveData();
    }

    // ---- DASHBOARD ----
    function renderDashboard(container){
      refreshAllProgress();
      const totalProjects = store.projects.length;
      const totalClients = store.clients.length;
      const tasksCompleted = store.tasks.filter(t => t.status === 'Completed').length;
      const tasksInProgress = store.tasks.filter(t => t.status === 'In Progress').length;
      const upcomingDeadlines = store.projects.filter(p => new Date(p.deadline) > new Date() && p.status !== 'Completed').length;

      const recentActivity = [...store.projects.map(p => ({type:'project', name:p.name, date:p.deadline})), ...store.tasks.map(t => ({type:'task', name:t.title, date:t.dueDate}))].slice(0,5);

      container.innerHTML = `
        <div class="cards-grid">
          <div class="stat-card"><span class="stat-icon"><i class="fas fa-briefcase"></i></span><div class="stat-label">Active Projects</div><div class="stat-number">${totalProjects}</div></div>
          <div class="stat-card"><span class="stat-icon"><i class="fas fa-users"></i></span><div class="stat-label">Clients</div><div class="stat-number">${totalClients}</div></div>
          <div class="stat-card"><span class="stat-icon"><i class="fas fa-check"></i></span><div class="stat-label">Tasks Done</div><div class="stat-number">${tasksCompleted}</div></div>
          <div class="stat-card"><span class="stat-icon"><i class="fas fa-spinner"></i></span><div class="stat-label">In Progress</div><div class="stat-number">${tasksInProgress}</div></div>
          <div class="stat-card"><span class="stat-icon"><i class="fas fa-clock"></i></span><div class="stat-label">Upcoming Deadlines</div><div class="stat-number">${upcomingDeadlines}</div></div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr;">
          <div class="panel"><div class="panel-header"><span class="panel-title">Project Progress</span></div>
            ${store.projects.map(p => `<div class="flex-between" style="margin-bottom:12px;"><span>${p.name}</span><span>${p.progress}%</span></div><div class="progress-bar" style="margin-bottom:12px;"><div class="progress-fill" style="width:${p.progress}%"></div></div>`).join('') || '<p>No projects yet.</p>'}
          </div>
          <div class="panel"><div class="panel-header"><span class="panel-title">Recent Activity</span></div>
            <ul style="list-style:none;">${recentActivity.map(a => `<li style="padding:10px 0;border-bottom:1px solid #f0f2f7;"><i class="fas ${a.type==='project'?'fa-folder':'fa-tasks'}" style="margin-right:8px;color:var(--primary)"></i>${a.name} <span style="color:#888;">${a.date||''}</span></li>`).join('')}</ul>
          </div>
        </div>
        <div class="panel"><canvas id="dashChart" height="120"></canvas></div>
      `;
      setTimeout(() => drawDashboardChart(), 100);
    }

    function drawDashboardChart(){
      const ctx = document.getElementById('dashChart'); if(!ctx) return;
      const statusCounts = {'Planning':0,'In Progress':0,'Review':0,'Completed':0,'On Hold':0};
      store.projects.forEach(p => statusCounts[p.status]++);
      new Chart(ctx, { type:'bar', data:{ labels:Object.keys(statusCounts), datasets:[{label:'Projects by status', data:Object.values(statusCounts), backgroundColor:'#3b5bfd'}] }});
    }

    // ---- PROJECTS ----
    function renderProjects(container){
      const searchTerm = document.getElementById('globalSearchInput').value.toLowerCase();
      let projects = store.projects.filter(p => p.name.toLowerCase().includes(searchTerm) || p.description.toLowerCase().includes(searchTerm));
      container.innerHTML = `
        <div class="flex-between" style="margin-bottom:16px;">
          <div class="flex"><button class="btn btn-primary" id="addProjectBtn"><i class="fas fa-plus"></i> New Project</button>
          <select id="projectFilter" class="btn"><option value="">All statuses</option><option>Planning</option><option>In Progress</option><option>Review</option><option>Completed</option><option>On Hold</option></select></div>
        </div>
        <div class="panel"><table><thead><tr><th>Name</th><th>Client</th><th>Status</th><th>Deadline</th><th>Progress</th><th>Actions</th></tr></thead><tbody>
        ${projects.map(p => {
          const client = getClientById(p.clientId);
          return `<tr><td>${p.name}</td><td>${client ? client.name : '—'}</td><td><span class="badge ${p.status.toLowerCase().replace(' ','-')}">${p.status}</span></td><td>${p.deadline}</td><td><div class="progress-bar" style="width:80px"><div class="progress-fill" style="width:${p.progress}%"></div></div> ${p.progress}%</td>
          <td><button class="btn btn-outline editProject" data-id="${p.id}" style="padding:6px 10px;"><i class="fas fa-edit"></i></button> <button class="btn btn-danger deleteProject" data-id="${p.id}" style="padding:6px 10px;"><i class="fas fa-trash"></i></button></td></tr>`;
        }).join('')}</tbody></table></div>`;
      document.getElementById('addProjectBtn')?.addEventListener('click', ()=> openProjectModal());
      document.getElementById('projectFilter')?.addEventListener('change', function(){
        const val = this.value; if(val) { store.projects.filter(p => p.status===val).forEach(p => alert(p.name)); } else renderProjects(container);
      });
      container.querySelectorAll('.editProject').forEach(btn => btn.addEventListener('click', (e)=> openProjectModal(e.target.closest('button').dataset.id)));
      container.querySelectorAll('.deleteProject').forEach(btn => btn.addEventListener('click', (e)=> { if(confirm('Delete project?')) { store.projects = store.projects.filter(p=>p.id!==e.target.closest('button').dataset.id); saveData(); renderProjects(container); }}));
    }

    function openProjectModal(projectId=null){
      const project = projectId ? getProjectById(projectId) : null;
      const modal = document.getElementById('modalContent');
      modal.innerHTML = `<h3>${project?'Edit':'New'} Project</h3>
        <div class="form-group"><label>Project name</label><input id="projName" value="${project?.name||''}"></div>
        <div class="form-group"><label>Client</label><select id="projClient">${store.clients.map(c=>`<option value="${c.id}" ${project?.clientId===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
        <div class="form-group"><label>Description</label><textarea id="projDesc">${project?.description||''}</textarea></div>
        <div class="form-group"><label>Status</label><select id="projStatus">${['Planning','In Progress','Review','Completed','On Hold'].map(s=>`<option ${project?.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="form-group"><label>Deadline</label><input type="date" id="projDeadline" value="${project?.deadline||''}"></div>
        <button class="btn btn-primary" id="saveProjectBtn">Save</button>`;
      document.getElementById('modalBackdrop').classList.add('active');
      document.getElementById('saveProjectBtn').addEventListener('click', ()=>{
        const name = document.getElementById('projName').value;
        if(!name) return;
        if(project){ Object.assign(project, { name, clientId:document.getElementById('projClient').value, description:document.getElementById('projDesc').value, status:document.getElementById('projStatus').value, deadline:document.getElementById('projDeadline').value }); }
        else store.projects.push({ id:'p'+Date.now(), name, clientId:document.getElementById('projClient').value, description:document.getElementById('projDesc').value, status:document.getElementById('projStatus').value, deadline:document.getElementById('projDeadline').value, progress:0 });
        saveData(); refreshAllProgress(); closeModal(); renderProjects(document.getElementById('appContent'));
      });
    }

    // TASKS similar with filtering etc. and client management, calendar, ai planner, analytics, settings.
    function renderTasks(container){ /* complete implementation same pattern */
      const tasks = store.tasks;
      container.innerHTML = `<div class="flex-between"><button class="btn btn-primary" id="addTaskBtn"><i class="fas fa-plus"></i> New Task</button><select class="btn" id="taskFilter"><option value="">All</option><option>To Do</option><option>In Progress</option><option>Completed</option></select></div>
      <div class="panel"><table><thead><tr><th>Task</th><th>Project</th><th>Due</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead><tbody>${tasks.map(t=>{ const proj=getProjectById(t.projectId); return `<tr><td>${t.title}</td><td>${proj?proj.name:'—'}</td><td>${t.dueDate}</td><td>${t.priority}</td><td><span class="badge">${t.status}</span></td><td><button class="btn btn-outline editTask" data-id="${t.id}">✏️</button> <button class="btn btn-danger deleteTask" data-id="${t.id}">🗑️</button></td></tr>`; }).join('')}</tbody></table></div>`;
      document.getElementById('addTaskBtn').addEventListener('click', ()=>openTaskModal());
      container.querySelectorAll('.editTask').forEach(b=>b.addEventListener('click', (e)=>openTaskModal(e.target.closest('button').dataset.id)));
      container.querySelectorAll('.deleteTask').forEach(b=>b.addEventListener('click', (e)=>{ store.tasks=store.tasks.filter(t=>t.id!==e.target.closest('button').dataset.id); saveData(); refreshAllProgress(); renderTasks(container);}));
    }
    function openTaskModal(taskId=null){ const task=taskId?store.tasks.find(t=>t.id===taskId):null; const modal=document.getElementById('modalContent'); modal.innerHTML=`<h3>${task?'Edit':'New'} Task</h3><div class="form-group"><label>Title</label><input id="taskTitle" value="${task?.title||''}"></div><div class="form-group"><label>Project</label><select id="taskProject">${store.projects.map(p=>`<option value="${p.id}" ${task?.projectId===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="form-group"><label>Due date</label><input type="date" id="taskDue" value="${task?.dueDate||''}"></div><div class="form-group"><label>Priority</label><select id="taskPriority">${['Low','Medium','High','Urgent'].map(p=>`<option ${task?.priority===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="form-group"><label>Status</label><select id="taskStatus">${['To Do','In Progress','Completed'].map(s=>`<option ${task?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn btn-primary" id="saveTaskBtn">Save</button>`; document.getElementById('modalBackdrop').classList.add('active'); document.getElementById('saveTaskBtn').addEventListener('click', ()=>{ if(task){ Object.assign(task,{title:document.getElementById('taskTitle').value, projectId:document.getElementById('taskProject').value, dueDate:document.getElementById('taskDue').value, priority:document.getElementById('taskPriority').value, status:document.getElementById('taskStatus').value}); } else store.tasks.push({id:'t'+Date.now(), title:document.getElementById('taskTitle').value, projectId:document.getElementById('taskProject').value, dueDate:document.getElementById('taskDue').value, priority:document.getElementById('taskPriority').value, status:document.getElementById('taskStatus').value}); saveData(); refreshAllProgress(); closeModal(); renderTasks(document.getElementById('appContent')); }); }

    function renderClients(container){ container.innerHTML = `<button class="btn btn-primary" id="addClientBtn"><i class="fas fa-plus"></i> Add Client</button><div class="panel" style="margin-top:16px">${store.clients.map(c=>`<div class="flex-between" style="padding:12px 0;border-bottom:1px solid #eee;"><div><strong>${c.name}</strong> · ${c.company} · ${c.email}</div><div><button class="btn btn-outline editClient" data-id="${c.id}">✏️</button> <button class="btn btn-danger deleteClient" data-id="${c.id}">🗑️</button></div></div>`).join('')}</div>`; document.getElementById('addClientBtn').onclick=()=>openClientModal(); container.querySelectorAll('.editClient').forEach(b=>b.onclick=(e)=>openClientModal(e.target.closest('button').dataset.id)); container.querySelectorAll('.deleteClient').forEach(b=>b.onclick=(e)=>{ store.clients=store.clients.filter(c=>c.id!==e.target.closest('button').dataset.id); saveData(); renderClients(container); }); }
    function openClientModal(clientId=null){ const client=clientId?getClientById(clientId):null; const modal=document.getElementById('modalContent'); modal.innerHTML=`<h3>${client?'Edit':'Add'} Client</h3><div class="form-group"><label>Name</label><input id="clientName" value="${client?.name||''}"></div><div class="form-group"><label>Email</label><input id="clientEmail" value="${client?.email||''}"></div><div class="form-group"><label>Phone</label><input id="clientPhone" value="${client?.phone||''}"></div><div class="form-group"><label>Company</label><input id="clientCompany" value="${client?.company||''}"></div><div class="form-group"><label>Notes</label><textarea id="clientNotes">${client?.notes||''}</textarea></div><button class="btn btn-primary" id="saveClientBtn">Save</button>`; document.getElementById('modalBackdrop').classList.add('active'); document.getElementById('saveClientBtn').onclick=()=>{ if(client){ Object.assign(client,{name:document.getElementById('clientName').value,email:document.getElementById('clientEmail').value,phone:document.getElementById('clientPhone').value,company:document.getElementById('clientCompany').value,notes:document.getElementById('clientNotes').value}); } else store.clients.push({id:'c'+Date.now(),name:document.getElementById('clientName').value,email:document.getElementById('clientEmail').value,phone:document.getElementById('clientPhone').value,company:document.getElementById('clientCompany').value,notes:document.getElementById('clientNotes').value}); saveData(); closeModal(); renderClients(document.getElementById('appContent')); }; }

    function renderCalendar(container){ const now=new Date(); const month=now.getMonth(); const year=now.getFullYear(); const days=new Date(year, month+1,0).getDate(); let cal = `<div class="flex-between"><button class="btn" id="prevMonth">◀</button><strong>${now.toLocaleString('en',{month:'long'})} ${year}</strong><button class="btn" id="nextMonth">▶</button></div><div class="grid" style="grid-template-columns:repeat(7,1fr); text-align:center; margin-top:12px;">`; for(let i=0;i<days;i++){ const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`; const projDead=store.projects.some(p=>p.deadline===dateStr); cal+=`<div style="padding:12px;background:${projDead?'#eef1ff':'#fff'};border-radius:8px;">${i+1}</div>`; } cal+='</div>'; container.innerHTML=cal; }

    function renderAIPlanner(container){ container.innerHTML=`<div class="panel"><h3>AI Project Planner</h3><textarea id="aiInput" rows="4" placeholder="e.g., I need to build an e-commerce website for a clothing company" style="width:100%;padding:14px;"></textarea><button class="btn btn-primary" id="generatePlanBtn">✨ Generate Plan</button><div id="aiResult" style="margin-top:20px;"></div></div>`; document.getElementById('generatePlanBtn').onclick=()=>{ const input=document.getElementById('aiInput').value.toLowerCase(); let plan=''; if(input.includes('e-commerce')||input.includes('website')) plan=`<strong>Project Overview:</strong> E-commerce platform for clothing.<br>Tasks: Product catalog, Cart, Payment, Mobile responsive, SEO.<br>Milestones: UI Design, Backend, Testing.<br>Timeline: 6-8 weeks.`; else plan=`<strong>Smart plan:</strong> Based on "${input}", we suggest: research, prototyping, development, QA, launch.<br>Timeline: 4-6 weeks.`; document.getElementById('aiResult').innerHTML=plan; }; }

    function renderAnalytics(container){ const completed=store.projects.filter(p=>p.status==='Completed').length; const total=store.projects.length; container.innerHTML=`<div class="cards-grid"><div class="stat-card">Project completion: ${total?Math.round(completed/total*100):0}%</div></div><div class="panel"><canvas id="analyticsChart"></canvas></div>`; setTimeout(()=>{ const ctx=document.getElementById('analyticsChart'); if(ctx) new Chart(ctx,{type:'doughnut', data:{labels:['Completed','Others'], datasets:[{data:[completed, total-completed], backgroundColor:['#2bb673','#e5e9f0']}]}}); },100); }

    function renderSettings(container){ container.innerHTML=`<div class="panel"><h3>Workspace Settings</h3><div class="form-group"><label>Workspace name</label><input id="wsName" value="${store.settings.workspaceName}"></div><div class="form-group"><label>Display name</label><input id="displayName" value="${store.settings.displayName}"></div><button class="btn btn-primary" id="saveSettings">Save</button> <button class="btn btn-danger" id="resetData">Reset sample data</button></div>`; document.getElementById('saveSettings').onclick=()=>{ store.settings.workspaceName=document.getElementById('wsName').value; store.settings.displayName=document.getElementById('displayName').value; saveData(); alert('Settings saved'); }; document.getElementById('resetData').onclick=()=>{ if(confirm('Reset all data?')){ store=defaultData(); saveData(); renderSettings(container); } }; }

    function closeModal(){ document.getElementById('modalBackdrop').classList.remove('active'); }

    // event listeners
    document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', ()=> switchPage(item.dataset.page)));
    document.getElementById('menuToggle').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));
    document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target===e.currentTarget) closeModal(); });

    // Init
    refreshAllProgress();
    renderPage('dashboard');
  })();
</script>
</body>
</html>
